name: Build and deploy site

# Builds the Jekyll blog and deploys it to GitHub Pages.
# Requires repo Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build blog with Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install 'jekyll:~>4.3' jekyll-sitemap jekyll-feed --no-document
      - run: jekyll build --destination _site
        env:
          JEKYLL_ENV: production
      # Pages serves the Actions artifact without Jekyll processing, so this
      # is only a guard in case the Pages source ever flips to a branch.
      - run: touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
